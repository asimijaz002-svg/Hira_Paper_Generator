function prepImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=2600,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=w;c.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);const d=ctx.getImageData(0,0,w,h);for(let k=0;k<d.data.length;k+=4){const v=.299*d.data[k]+.587*d.data[k+1]+.114*d.data[k+2],z=Math.max(0,Math.min(255,(v-128)*1.22+128));d.data[k]=d.data[k+1]=d.data[k+2]=z;}ctx.putImageData(d,0,0);URL.revokeObjectURL(url);resolve(c.toDataURL('image/png'))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image could not be opened'))};img.src=url})}
function showOCR(text,i){pendingOCR={text,section:i};const s=P.secs[i],m=$('#ocrModal');m.innerHTML=`<div class="ocr-card"><div class="r"><h3 style="margin:0">📄 Review scanned text</h3><span class="sp"></span><button data-ocr="close">✕</button></div><p class="ocr-help">Check the extracted text and correct OCR mistakes before inserting it. Urdu text can be edited right-to-left.</p><textarea id="ocrText" dir="auto">${e(text)}</textarea><div class="r"><label>Where should this text go?<select id="ocrTarget"><option value="current">Add to current section (${e(T[s.type])})</option><option value="replace">Replace current section text</option><option value="passage">Use as reading passage</option><option value="new">Create a new section for this text</option></select></label></div><div class="r"><label>Text direction<select id="ocrDir"><option value="auto">Auto detect</option><option value="rtl">Urdu / RTL</option><option value="ltr">English / LTR</option></select></label></div><div class="r"><span class="sp"></span><button data-ocr="close">Cancel</button><button class="pri" data-ocr="insert">Insert text</button></div></div>`;m.classList.add('on')}
async function ocr(i,f){const s=P.secs[i];try{toast('Preparing image…');await lt();const img=await prepImage(f),lang=s.rtl||P.medium==='ur'?'urd+eng':'eng';const r=await Tesseract.recognize(img,lang,{logger:m=>{if(m.status==='recognizing text')toast('Reading image… '+Math.round(m.progress*100)+'%')}});const t=r.data.text.split('\\n').map(x=>x.trim()).filter(Boolean).join('\\n');if(!t)return toast('No text found. Try a brighter, straight, close-up photo with clear text.');showOCR(t,i)}catch(x){console.error(x);toast('Scanner could not read this image. Check your internet connection and try a clearer photo.')}}
function insertOCR(){const text=$('#ocrText').value.trim(),target=$('#ocrTarget').value,dir=$('#ocrDir').value;if(!text)return toast('There is no text to insert');let s=P.secs[pendingOCR.section];if(dir==='rtl'||(dir==='auto'&&/[\\u0600-\\u06FF]/.test(text)))s.rtl=1;else if(dir==='ltr')s.rtl=0;if(target==='passage'){s.type='passage';s.instr=INS.passage;s.pass=text}else if(target==='new'){const n=sec('custom');n.raw=text;n.rtl=dir==='rtl'||(dir==='auto'&&/[\\u0600-\\u06FF]/.test(text))?1:0;P.secs.push(n)}else if(target==='replace')s.raw=text;else s.raw+=(s.raw?'\\n':'')+text;$('#ocrModal').classList.remove('on');R();toast('Text inserted. Please proofread the questions before printing.')}

document.addEventListener('click',ev=>{const ob=ev.target.closest('[data-ocr]');if(ob){if(ob.dataset.ocr==='insert')insertOCR();else $('#ocrModal').classList.remove('on')}});
document.addEventListener('change',ev=>{if(ev.target.id=='sf'&&ev.target.files[0]&&P)ocr(ui.si,ev.target.files[0])});
let religionSection=0,religionMode='quran',religionBusy=false;
function openReligion(i){religionSection=Math.max(0,Math.min(i,P.secs.length-1));const m=$('#religionModal');m.innerHTML=`<div class="religion-card"><div class="r"><div><h3 style="margin:0">📖 ${isUr(P)?'قرآنی آیات اور احادیث':'Quranic verses & Hadith'}</h3><div class="sm">${isUr(P)?'مستند متن تلاش کریں، حوالہ دیکھیں، پھر پرچے میں شامل کریں۔':'Search verified source text, review its reference, then insert it.'}</div></div><span class="sp"></span><button data-rel="close">✕</button></div><div class="religion-tabs"><button class="on" data-rel="tab" data-v="quran">${isUr(P)?'قرآنی آیات':'Quran verses'}</button><button data-rel="tab" data-v="hadith">${isUr(P)?'احادیث':'Hadith'}</button></div><div id="relQuran"><label>${isUr(P)?'موضوع یا لفظ لکھیں (مثلاً نماز، صبر، والدین)':'Search a topic or word (e.g. prayer, patience, parents)'}<input id="relQuery" placeholder="${isUr(P)?'یہاں تلاش کریں':'Search here'}"></label><div class="r"><button class="pri" data-rel="search">${isUr(P)?'آیات تلاش کریں':'Search verses'}</button><span class="sm">${isUr(P)?'قرآنِ عثمانی متن اور اردو ترجمہ':'Uthmani Arabic text + Urdu translation'}</span></div></div><div id="relHadith" style="display:none"><p class="sm">${isUr(P)?'منتخب احادیث؛ ہر روایت کے ساتھ مجموعہ اور حدیث نمبر دیا گیا ہے۔':'Curated narrations with collection and hadith number.'}</p><label>${isUr(P)?'موضوع منتخب کریں':'Filter by topic'}<input id="hadithQuery" placeholder="${isUr(P)?'مثلاً نیت، اخلاق، دین':'e.g. intention, manners, faith'}"></label></div><div id="religionResults"><p class="sm">${isUr(P)?'موضوع لکھ کر قرآنی آیات تلاش کریں، یا احادیث کے ٹیب میں منتخب روایات دیکھیں۔':'Search for Quran verses, or browse the curated Hadith tab.'}</p></div><div class="sm">Quran text: AlQuran.cloud API · quran-uthmani; Urdu translation: ur.jalandhry. ${isUr(P)?'براہِ کرم چھاپنے سے پہلے اصل مصحف/مستند نسخے سے مقابلہ کرلیں۔':'Please cross-check the final printed text against a trusted Mushaf.'}</div></div>`;m.classList.add('on');}
function renderHadith(){const q=($('#hadithQuery')?.value||'').trim().toLowerCase(),list=hadithLibrary.filter(x=>!q||(x.topic+' '+x.ur).toLowerCase().includes(q));$('#religionResults').innerHTML=list.map((x,i)=>`<div class="religion-result"><div class="sm">${e(x.topic)} · ${e(x.ref)} · <a href="${e(x.url||'https://sunnah.com')}" target="_blank" rel="noopener">${isUr(P)?'اصل حوالہ دیکھیں':'Verify source'}</a></div><div class="quran-ar" dir="rtl">${e(x.ar)}</div><div class="quran-ur">${e(x.ur)}</div><div class="r"><span class="sp"></span><button class="pri" data-rel="insert-hadith" data-i="${hadithLibrary.indexOf(x)}">${isUr(P)?'پرچے میں شامل کریں':'Insert into paper'}</button></div></div>`).join('')||`<p class="sm">${isUr(P)?'اس موضوع پر منتخب روایت نہیں ملی۔':'No curated narration matched this topic.'}</p>`;}
async function searchQuran(){const q=$('#relQuery').value.trim();if(!q)return toast(isUr(P)?'تلاش کے لیے کوئی لفظ لکھیں':'Enter a search term');const box=$('#religionResults');box.innerHTML=`<p class="sm">${isUr(P)?'قرآنی آیات تلاش ہو رہی ہیں…':'Searching Quran…'}</p>`;try{const url='https://api.alquran.cloud/v1/search/'+encodeURIComponent(q)+'/all/ur.jalandhry';const res=await fetch(url);if(!res.ok)throw Error('Quran search unavailable');const data=await res.json();const matches=(data.data&&data.data.matches)||[];if(!matches.length){box.innerHTML=`<p class="sm">${isUr(P)?'کوئی آیت نہیں ملی۔ دوسرا لفظ آزمائیں۔':'No verses found. Try another word.'}</p>`;return}const chosen=matches.slice(0,12);const detailed=await Promise.all(chosen.map(async x=>{const ref=x.surah.number+':'+x.numberInSurah;const r=await fetch('https://api.alquran.cloud/v1/ayah/'+encodeURIComponent(ref)+'/editions/quran-uthmani,ur.jalandhry');const j=await r.json();return {ref,items:j.data||[]}}));box.innerHTML=detailed.map((x,i)=>{const ar=x.items.find(z=>z.edition.identifier==='quran-uthmani')?.text||'',ur=x.items.find(z=>z.edition.identifier==='ur.jalandhry')?.text||chosen[i].text;return `<div class="religion-result"><div class="sm">${e(chosen[i].surah.englishName)} · ${e(chosen[i].surah.name)} · ${e(x.ref)}</div><div class="quran-ar" dir="rtl">${e(ar)}</div><div class="quran-ur">${e(ur)}</div><div class="r"><span class="sp"></span><button class="pri" data-rel="insert-ayah" data-i="${i}">${isUr(P)?'پرچے میں شامل کریں':'Insert into paper'}</button></div></div>`}).join('');window.__hmsQuranResults=detailed.map((x,i)=>({ref:x.ref,ar:x.items.find(z=>z.edition.identifier==='quran-uthmani')?.text||'',ur:x.items.find(z=>z.edition.identifier==='ur.jalandhry')?.text||chosen[i].text,surah:chosen[i].surah.name}));}catch(err){console.error(err);box.innerHTML=`<p class="sm">${isUr(P)?'قرآن کی آن لائن تلاش دستیاب نہیں۔ انٹرنیٹ چیک کریں یا حوالہ سے خود تصدیق کریں۔':'Online Quran search is unavailable. Check internet access and verify the reference manually.'}</p>`}}
function addReligiousText(ar,translation,ref,kind){const s=P.secs[religionSection]||P.secs[0];if(!s)return toast(isUr(P)?'پہلے سوال کا سیکشن شامل کریں':'Add a question section first');const passage=`${ar}\n\n${translation}\n\n(${ref})`;const n=sec('passage');n.raw=isUr(P)?'اس عبارت کا ترجمہ لکھیں۔':'Write the translation of the passage.';n.instr=isUr(P)?(kind==='ayah'?'آیتِ مبارکہ پڑھیں اور ترجمہ لکھیں۔':'حدیثِ مبارکہ پڑھیں اور ترجمہ لکھیں۔'):(kind==='ayah'?'Read the Quranic verse and its translation.':'Read the Hadith and its translation.');n.pass=passage;n.rtl=1;P.secs.push(n);$('#religionModal').classList.remove('on');R();toast(isUr(P)?'متن نئے مطالعہ سیکشن میں شامل ہوگیا؛ حوالہ ضرور چیک کریں۔':'Added as a new passage section. Please verify the reference.');}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-rel]');if(!b)return;const a=b.dataset.rel;if(a==='close')$('#religionModal').classList.remove('on');else if(a==='tab'){religionMode=b.dataset.v;$('#relQuran').style.display=religionMode==='quran'?'block':'none';$('#relHadith').style.display=religionMode==='hadith'?'block':'none';document.querySelectorAll('.religion-tabs button').forEach(x=>x.classList.toggle('on',x===b));if(religionMode==='hadith')renderHadith()}else if(a==='search')searchQuran();else if(a==='insert-hadith'){const h=hadithLibrary[+b.dataset.i];addReligiousText(h.ar,h.ur,h.ref,'hadith')}else if(a==='insert-ayah'){const x=(window.__hmsQuranResults||[])[+b.dataset.i];if(x)addReligiousText(x.ar,x.ur,`${x.surah}، آیت ${x.ref.split(':')[1]}`,'ayah')}});
document.addEventListener('input',ev=>{if(ev.target.id==='hadithQuery')renderHadith()});
const byK=k=>db.papers.find(p=>p.k==k);
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;if(d.pw){me.p=t.value;save();return}if(d.set){const v=t.value;db.set[d.set]=d.set=='exams'?v.split(',').map(x=>x.trim()).filter(Boolean):d.set=='font'?+v:v;save();return}
if(!P)return;const v=t.type=='checkbox'?+t.checked:t.value;
if(d.k!==undefined){const s=P.secs[+d.s];if(d.k=='type'){if(!s.instr||s.instr==INS[s.type]||s.instr==UR_INS[s.type])s.instr=isUr(P)?(UR_INS[v]||'درج ذیل سوالات حل کریں۔'):(INS[v]||'');s.type=v;s.each=v=='mcq'?1:s.each;if(isUr(P))s.rtl=1;R();return}s[d.k]=['each','attempt'].includes(d.k)?+v:v;if(d.k==='raw'){if(/[\u0600-\u06FF]/.test(v))s.rtl=1;const related=/(آیت|آیات|قرآن|حدیث|احادیث|سورۃ|قرآنی|ayat|quran|hadith)/i.test(v),hint=document.querySelector('[data-relhint=\"'+d.s+'\"]');if(hint)hint.hidden=!related}}else if(d.f){P[d.f]=['fs','declared'].includes(d.f)&&v!==''?+v:v;if(d.f==='medium'){P.secs.forEach(x=>localizeSection(x,P.medium));R();return}}else return;refresh()});
document.addEventListener('change',ev=>{if(ev.target.id=='lg'){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{db.set.logo=r.result;save();toast('Logo saved')};r.readAsDataURL(f)}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset,i=+d.i;
if(a=='in'){const u=db.users.find(x=>x.u==$('#lu').value.trim()&&x.p==$('#lp').value);if(!u||!u.active)return toast('Wrong username/password or inactive account');me=u}
else if(a=='inst'){if(dip){dip.prompt();dip=null}}else if(a=='religion'){openReligion(i);return}else if(a=='mp'){ui.mp=!ui.mp;mpR();return}else if(a=='scan'){ui.si=i;$('#sf').value='';$('#sf').click();return}else if(a=='mpt'){ui.mc=d.v;mpR();return}else if(a=='mpi'){ins(b.textContent);return}else if(a=='tin'){const n=$('#tn').value.trim();if(!n)return toast('Enter your name');const u=n.toLowerCase().replace(/\s+/g,'_');let x=db.users.find(y=>y.u==u);if(x&&x.role=='admin')return toast('Please use the admin sign-in');if(!x){x={u,p:'',name:n,role:'teacher',active:1,as:''};db.users.push(x)}if(!x.active)return toast('Account inactive');me=x}
else if(a=='out'){me=null;P=null}else if(a=='at')ui.at=d.v;else if(a=='tab')ui.tab=d.v;
else if(a=='new'){P={k:Date.now()+'',u:me.u,by:me.name,exam:db.set.exams[0]||'',session:db.set.session,cls:'',subject:'',time:'',declared:'',fs:db.set.font,medium:'en',status:'draft',secs:[sec('mcq')],at:'',id:'',note:'',upd:now()};db.papers.push(P);undo=null;chg=[];ui.tab='edit'}
else if(a=='open'){P=byK(d.k);undo=null;chg=[]}else if(a=='back'){P=null;save()}
else if(a=='dup'){const o=byK(d.k),c=JSON.parse(JSON.stringify(o));Object.assign(c,{k:Date.now()+'',u:me.u,by:me.name,status:'draft',id:'',at:'',note:'',upd:now()});db.papers.push(c);save();toast('Copied as a new draft')}
else if(a=='prn'||a=='print'){if(me.role!='admin')return toast('Printing is for the administrator only');return pr(a=='prn'?byK(d.k):P)}else if(a=='shr'||a=='share'){shareP(a=='shr'?byK(d.k):P);return}
else if(a=='rm'){db.papers=db.papers.filter(p=>p.k!=d.k);save()}
else if(a=='adds'){const ns=sec($('#nt').value);if(isUr(P))localizeSection(ns,'ur');P.secs.push(ns)}else if(a=='ds'){P.secs.splice(i,1)}
else if(a=='up'&&i>0){[P.secs[i-1],P.secs[i]]=[P.secs[i],P.secs[i-1]]}else if(a=='dn'&&i<P.secs.length-1){[P.secs[i+1],P.secs[i]]=[P.secs[i],P.secs[i+1]]}
else if(a=='fix'){undo=P.secs.map(s=>[s.raw,s.pass]);chg=[];P.secs.forEach(s=>{s.raw=fixRaw(s,chg);if(s.pass)s.pass=s.pass.split('\n').map(x=>fmt(x,'p',1)).join('\n')});toast(chg.length?chg.length+' line(s) corrected — review below or Undo':'Nothing to correct')}
else if(a=='undo'){if(undo){P.secs.forEach((s,j)=>{if(undo[j]){s.raw=undo[j][0];s.pass=undo[j][1]}});undo=null;chg=[];toast('Corrections undone')}}
else if(a=='ren'){P.secs.forEach(s=>{if(s.type!='match')s.raw=s.raw.split('\n').map(l=>l.replace(NUM,'')).join('\n')});toast('Manual numbers removed — questions are now numbered automatically')}
else if(a=='sub'){const E=check(P).filter(x=>x.l=='e');if(E.length){toast(E.length+' error(s) must be fixed before submitting');$('#wn').scrollIntoView();return}
db.n++;Object.assign(P,{status:'submitted',id:'HMS-'+new Date().getFullYear()+'-'+String(db.n).padStart(4,'0')+'-'+me.u.slice(0,3).toUpperCase(),at:now(),upd:now(),note:''});toast('Submitted as '+P.id)}
else if(['ap','rv','rj'].includes(a)){P.status={ap:'approved',rv:'revision',rj:'rejected'}[a];P.note=$('#an').value;P.upd=now();P=null}
else if(a=='addu'){const u=$('#nu').value.trim();if(!u||!$('#np').value||db.users.some(x=>x.u==u))return toast('Enter a unique username and a password');db.users.push({u,p:$('#np').value,name:$('#nn').value||u,role:'teacher',active:1,as:$('#na').value})}
else if(a=='tg'){if(db.users[i]!=me)db.users[i].active=+!db.users[i].active}else if(a=='du'){if(db.users[i]!=me)db.users.splice(i,1)}
else if(a=='ipp'){try{const c=$('#ipc').value.trim().replace(/^HMSPAPER:/,''),x=JSON.parse(decodeURIComponent(escape(atob(c))));if(!x.k||!x.secs)throw 0;const j=db.papers.findIndex(p=>p.k==x.k);if(j>=0)db.papers[j]=x;else db.papers.push(x);toast('Paper imported')}catch(x){return toast('Invalid paper code')}}
else if(a=='imp'){try{const x=JSON.parse($('#imp').value);if(!x.users||!x.papers||!x.set)throw 0;db=x;me=db.users.find(u=>u.u==me.u)||null;P=null;toast('Backup restored')}catch(x){return toast('Invalid backup text')}}
save();R()});
$('#app').addEventListener('keydown',ev=>{if(ev.key=='Enter'&&!me)document.querySelector('[data-a=in]').click()});R();if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
