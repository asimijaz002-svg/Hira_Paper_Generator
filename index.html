function okLogin(){try{localStorage.removeItem(LK)}catch(x){}}

/* ===== CLOUD SYNC (Firebase Realtime Database, REST + streaming) ===== */
const CLOUD={url:'https://exam-generator-c7a5a-default-rtdb.firebaseio.com',root:'hira-exam-7Kq92xMvB4'};
const SYK='hms_sync',hex=s=>[...enc.encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('');
const cloudOn=()=>!!(CLOUD.url&&CLOUD.root&&location.protocol!='file:'),CU=()=>CLOUD.url.replace(/\/+$/,'')+'/'+CLOUD.root;
let cloud={},base=null,es=null,pend=0,pushT,cloudReady=false;
function flat(d){const m={set:JSON.stringify(d.set),n:String(d.n)};d.users.forEach(u=>m['u/'+hex(u.u)]=JSON.stringify(u));d.papers.forEach(p=>m['p/'+p.k]=JSON.stringify(p));return m}
function cflat(c){const m={};if(c&&c.set!=null)m.set=c.set;if(c&&c.n!=null)m.n=String(c.n);for(const g of['u','p'])if(c&&c[g]&&typeof c[g]=='object')for(const k in c[g])if(c[g][k]!=null)m[g+'/'+k]=c[g][k];return m}
function setPath(path,data,merge){const parts=path.split('/').filter(Boolean);if(!parts.length){if(merge&&data&&typeof data=='object'){for(const k in data)setPath('/'+k,data[k])}else cloud=data&&typeof data=='object'?data:{};return}let o=cloud;for(let i=0;i<parts.length-1;i++){if(!o[parts[i]]||typeof o[parts[i]]!='object')o[parts[i]]={};o=o[parts[i]]}const l=parts[parts.length-1];if(merge&&data&&typeof data=='object'&&o[l]&&typeof o[l]=='object'){for(const k in data){if(data[k]==null)delete o[l][k];else o[l][k]=data[k]}}else if(data==null)delete o[l];else o[l]=data}
function saveBase(){try{localStorage.setItem(SYK,JSON.stringify(base))}catch(x){}}
function fromFlat(m){const d={users:[],set:null,papers:[],n:0};for(const k in m){try{if(k=='set')d.set=JSON.parse(m[k]);else if(k=='n')d.n=+m[k]||0;else if(k[0]=='u')d.users.push(JSON.parse(m[k]));else if(k[0]=='p')d.papers.push(JSON.parse(m[k]))}catch(x){}}return d}
/* three-way merge: base (last synced) vs local vs remote */
function reconcile(){const L=flat(db),Rm=cflat(cloud),B=base||{},out={},push={};const first=!base;
for(const k of new Set([...Object.keys(L),...Object.keys(Rm),...Object.keys(B)])){const l=L[k],r=Rm[k],b=B[k];
if(k=='n'){const v=Math.max(+l||0,+r||0);out.n=String(v);if(r!=String(v))push.n=String(v);continue}
if(first){if(r!=null)out[k]=r;else if(l!=null){out[k]=l;push[k]=l}continue}
if(l===r){if(l!=null)out[k]=l;continue}
if(l===b){if(r!=null)out[k]=r}/* only remote changed (or removed) */
else if(r===b){if(l!=null){out[k]=l;push[k]=l}else push[k]=null}/* only local changed (or removed) */
else{if(l!=null&&P&&k=='p/'+P.k){out[k]=l;push[k]=l}else if(r!=null)out[k]=r;else if(l!=null){out[k]=l;push[k]=l}}}/* both changed: remote wins, except paper being edited */
return{out,push}}
async function sendPush(push){const ks=Object.keys(push);if(!ks.length)return;const body={};ks.forEach(k=>body[k]=push[k]);const r=await fetch(CU()+'.json',{method:'PATCH',body:JSON.stringify(body)});if(!r.ok)throw Error('push '+r.status)}
function applyMerged(out,push,live){const d=fromFlat(out);if(!d.set)d.set=db.set;let nd;try{nd=cleanDB({users:d.users,set:d.set,papers:d.papers,n:d.n})}catch(x){return false}
const mk=me&&me.u,pk=P&&P.k;db=nd;if(mk){me=db.users.find(u=>u.u==mk)||null}if(pk){P=db.papers.find(p=>p.k==pk)||null}
try{localStorage.setItem(K,JSON.stringify(db))}catch(x){}return true}
async function syncNow(live){if(!cloudOn()||setup||pend)return;pend=1;try{const{out,push}=reconcile();const fl=flat(db),changedLocal=Object.keys(out).length!==Object.keys(fl).length||Object.keys(out).some(k=>out[k]!==fl[k]);if(Object.keys(push).length)await sendPush(push);base=out;saveBase();if(changedLocal&&applyMerged(out,push,live)){if(live)uiRefresh()}else if(live&&!me&&!setup){}}catch(x){console.warn('sync',x);cloudStatus(0)}finally{pend=0}}
function uiRefresh(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;if(!me){R();return}if(P)return;if($('#shr').classList.contains('on'))return;const sy=scrollY;R();scrollTo(0,sy)}
function cloudStatus(ok){const el=$('#cst');if(el){el.textContent=ok?'☁ Synced':'☁ Offline';el.style.opacity=ok?1:.6}}
function schedulePush(){if(!cloudOn())return;clearTimeout(pushT);pushT=setTimeout(()=>syncNow(false),600)}
function startStream(){if(!cloudOn()||es)return;try{es=new EventSource(CU()+'.json');const h=m=>ev=>{try{const j=JSON.parse(ev.data);if(!j)return;setPath(j.path||'/',j.data,m);cloudReady=true;clearTimeout(window.__st);window.__st=setTimeout(()=>syncNow(true).then(()=>cloudStatus(1)),250)}catch(x){}};es.addEventListener('put',h(false));es.addEventListener('patch',h(true));es.onerror=()=>cloudStatus(0);es.onopen=()=>cloudStatus(1)}catch(x){}}
async function cloudInit(){if(!cloudOn())return;try{base=JSON.parse(localStorage.getItem(SYK)||'null')}catch(x){base=null}
try{const r=await fetch(CU()+'.json');if(!r.ok)throw 0;cloud=(await r.json())||{};
const hasCloud=cloud&&cloud.u&&Object.keys(cloud.u).length;
if(hasCloud){const wasSetup=setup;if(setup){db={users:[],set:DS(),papers:[],n:0}}const{out,push}=reconcile();if(Object.keys(push).length)await sendPush(push);base=out;saveBase();if(applyMerged(out,push,false)){setup=false}}
else if(!setup){const{out,push}=reconcile();await sendPush(push);base=out;saveBase()}}catch(x){console.warn('cloud init failed',x)}
startStream();addEventListener('online',()=>syncNow(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(es&&es.readyState==2){es=null;startStream()}syncNow(true)}})}
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('[data-eye]');if(!b)return;ev.stopPropagation();const i=document.getElementById(b.dataset.eye);if(!i)return;const s=i.type=='password';i.type=s?'text':'password';b.classList.toggle('on',s);b.setAttribute('aria-label',s?'Hide password':'Show password');b.innerHTML=s?'&#128584;':'&#128065;'},true);
async function migrate(){let ch=0;for(const u of db.users){if(u.p&&!/^v1\$/.test(u.p)){if(u.role=='admin'&&u.p=='admin123')u.mc=1;u.p=await hp(u.p);ch=1}}if(ch)save()}

addEventListener('resize',fitPv);

addEventListener('keydown',ev=>{if(ev.key!=='Escape'||(me&&me.mc))return;const c=$('#an2')||$('#cx')||$('#pwc');if($('#shr').classList.contains('on')&&c)c.click();$('#ocrModal').classList.remove('on');$('#religionModal').classList.remove('on')});
let idt;const idle=()=>{clearTimeout(idt);if(me)idt=setTimeout(()=>{me=null;P=null;$('#shr').classList.remove('on');R();toast('Signed out after 20 minutes of inactivity')},12e5)};['click','keydown','touchstart'].forEach(n=>addEventListener(n,idle,{passive:true}));
$('#app').addEventListener('keydown',ev=>{if(ev.key!='Enter'||me)return;const bt=document.querySelector(ev.target.closest&&ev.target.closest('[data-tf]')?'[data-a=tin]':'[data-a=in],[data-a=setup]');if(bt)bt.click()});
(cloudOn()?Promise.race([cloudInit(),new Promise(r=>setTimeout(r,6000))]):Promise.resolve()).then(()=>migrate()).then(R).catch(()=>R());if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
