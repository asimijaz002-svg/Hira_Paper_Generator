<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d4f91"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hira Model School – Exam Paper Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fa;--cd:#fff;--tx:#1b2433;--mu:#64708a;--bd:#d5dce8;--pri:#1d4f91;--prt:#fff;--ok:#1b7a3d;--er:#b3261e;--wa:#9a6700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111826;--cd:#1a2332;--tx:#e8edf6;--mu:#98a5bd;--bd:#2c3a50;--pri:#5b9bf0;--prt:#0b1220;--ok:#5fd18a;--er:#ff8a80;--wa:#f2c35b}}
:root[data-theme="dark"]{--bg:#111826;--cd:#1a2332;--tx:#e8edf6;--mu:#98a5bd;--bd:#2c3a50;--pri:#5b9bf0;--prt:#0b1220;--ok:#5fd18a;--er:#ff8a80;--wa:#f2c35b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit;background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;max-width:100%}
button{cursor:pointer}button.pri{background:var(--pri);color:var(--prt);border-color:var(--pri);font-weight:600}button.g{background:none}
textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:14px}label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;flex:1;min-width:120px}label.ck{flex-direction:row;align-items:center;color:var(--tx);flex:none}label.ck input{width:auto}
fieldset{border:0;padding:0;margin:0;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--pri);color:var(--prt);position:sticky;top:0;z-index:5}.top button{background:none;color:var(--prt);border-color:var(--prt);margin-left:8px}
.wrap{max-width:1300px;margin:auto;padding:14px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}.sp{flex:1}.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--pri);color:var(--prt)}
.g{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:1000px){.g{grid-template-columns:minmax(380px,5fr) 6fr}.tabs.m{display:none}}
@media(max-width:999px){.g.edit #pv{display:none}.g.pv #ed{display:none}}
.sc{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:10px 0;background:var(--bg)}.sc input,.sc select{margin:3px 0}
.w{padding:5px 8px;border-radius:6px;margin:3px 0;font-size:13px}.w.e{background:color-mix(in srgb,var(--er) 15%,transparent);color:var(--er)}.w.w{background:color-mix(in srgb,var(--wa) 15%,transparent);color:var(--wa)}.w.ok{color:var(--ok)}
.nt{padding:8px;border-left:4px solid var(--wa);background:var(--bg);margin-bottom:8px}table.l{width:100%;border-collapse:collapse}.l th,.l td{text-align:left;padding:7px;border-bottom:1px solid var(--bd);font-size:14px}
.b{padding:2px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px}.sm{font-size:12px;color:var(--mu)}.x{overflow-x:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:90%}
.pap{background:#fff;color:#000;width:210mm;padding:12mm;margin:0 auto;box-shadow:0 2px 12px #0004;font-family:"Times New Roman",Times,serif}
.sh h1{margin:0;font-size:1.5em;text-align:center}.hd{display:flex;align-items:center;gap:12px;justify-content:center;text-align:center;border-bottom:2px solid #000;padding-bottom:6px}.hd img{height:60px}
.mt{width:100%;border-collapse:collapse;margin:6px 0}.mt td{border:1px solid #000;padding:3px 6px}
.sg{margin-top:.9em;border-bottom:1px solid #000;break-after:avoid;overflow:hidden}.sg span{float:right;font-weight:bold}.ur .sg span{float:left}
.q{display:flex;gap:.5em;margin:.35em 0;break-inside:avoid}.op{margin-top:.15em;display:flex;flex-direction:column}.op.h{flex-direction:row;flex-wrap:wrap;gap:.2em 1.6em}.sb{margin-left:1em}
.mc{width:100%;border-collapse:collapse}.mc td{padding:3px}.ps{text-align:justify;margin:.5em 0}.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Times New Roman",serif;line-height:2.1}
#shr{display:none;position:fixed;inset:0;background:#0008;z-index:8;align-items:center;justify-content:center}#shr.on{display:flex}#shr .card{width:min(92%,420px);margin:0}#shr a,#shr button{display:block;width:100%;margin:8px 0 0;text-align:center;text-decoration:none;padding:10px;border:1px solid var(--bd);border-radius:8px;color:var(--tx);background:var(--cd)}#shr a{background:#1faa59;color:#fff;border-color:#1faa59;font-weight:600}
#mpw{display:none}#mpw.on{display:block;position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--cd);border-top:2px solid var(--pri);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));max-height:42vh;overflow:auto}.sy{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.sy button{min-width:38px;font-size:17px;padding:4px 8px}#mpw .on{background:var(--pri);color:var(--prt)}
#print{display:none}
@page{size:A4;margin:12mm 12mm 14mm;@bottom-center{content:"Page " counter(page) " of " counter(pages);font-size:9pt}}
@media print{html,body{background:#fff}#app,#toast,#shr,#mpw{display:none!important}#print{display:block}#print .pap{box-shadow:none;width:auto;padding:0;margin:0}}
</style></head><body><div id="app"></div><div id="print"></div><div id="shr"></div><div id="mpw"></div><input type="file" id="sf" accept="image/*" hidden><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),K='hms_exam_db',now=()=>new Date().toLocaleString();
const T={mcq:'Multiple Choice',fill:'Fill in the Blanks',tf:'True / False',short:'Short Questions',long:'Long Questions',match:'Match the Columns',word:'Word Meanings',trans:'Translation',passage:'Comprehension',gram:'Grammar',math:'Mathematics',custom:'Custom'};
const INS={mcq:'Choose the correct option.',fill:'Fill in the blanks.',tf:'Write True or False.',short:'Answer the following questions briefly.',long:'Answer the following questions in detail.',match:'Match the columns.',word:'Write the meanings of the following words.',trans:'Translate the following sentences.',passage:'Read the passage and answer the questions.',gram:'Do as directed.',math:'Solve the following.',custom:''};
const PH={mcq:'1. Question text\nA) option\nB) option\nC) option\nD) option\n2. Next question...',match:'Left item | Right item\nLeft item 2 | Right item 2',passage:'Questions on the passage, one per line',x:'One question per line. Numbers optional. Use (a), (b) for sub-parts.'};
const NUM=/^\s*(?:Q(?:uestion)?\.?\s*)?(\d+)\s*[.):\-]\s*/i,OPT=/^\s*\(?([a-hA-H])[.)]\s+/;
const PN='pakistan lahore karachi islamabad multan punjab sindh islam allah quran urdu english arabic muhammad monday tuesday wednesday thursday friday saturday sunday january february april june july august september october november december'.split(' ');
let db=ld(),me=null,P=null,ui={at:'papers',tab:'edit'},undo=null,chg=[],tm;
function ld(){try{const d=JSON.parse(localStorage.getItem(K));if(d)return d}catch(x){}return{users:[{u:'admin',p:'admin123',name:'Administrator',role:'admin',active:1,as:''}],set:{school:'HIRA MODEL SCHOOL, KHESHGI',session:'2026–2027',exams:['1st Term','2nd Term','Mid Term','Annual Examination'],logo:'',font:12},papers:[],n:0}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(x){toast('Storage full or unavailable')}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
const sec=t=>({t:0,type:t,instr:INS[t],each:t=='mcq'?1:2,attempt:0,raw:'',pass:'',rtl:0,horiz:1});
function parse(s){const o=[];let c=null;for(const l of s.raw.split('\n')){if(!l.trim()){c=null;continue}
if(s.type=='match'){const[a,b]=l.split('|');o.push({t:(a||'').trim(),r:(b||'').trim(),o:[],s:[],num:null});continue}
const n=l.match(NUM);if(n){c={t:l.slice(n[0].length),num:+n[1],o:[],s:[]};o.push(c);continue}
const p=c&&l.match(OPT);if(p){(s.type=='mcq'?c.o:c.s).push({k:p[1].toLowerCase(),t:l.slice(p[0].length)});continue}
c={t:l.trim(),num:null,o:[],s:[]};o.push(c)}return o}
const att=s=>{const n=parse(s).length;return s.attempt>0&&s.attempt<n?s.attempt:n},sm=s=>att(s)*s.each,total=p=>p.secs.reduce((a,s)=>a+sm(s),0);
function fmt(s,type,opt){if(/[\u0600-\u06FF]/.test(s))return s.replace(/\s+/g,' ').trim();if(type=='math'&&/[=<>≤≥≠±×÷√∑∫²³∠△∈⊂∪∩+^\/]/.test(s))return s.replace(/\s+/g,' ').trim();let r=s.replace(/\s+/g,' ').trim();if(!r)return r;
r=r.replace(/\s+([,.;:!?)])/g,'$1').replace(/\(\s+/g,'(').replace(/([,;:!?])(?=[A-Za-z])/g,'$1 ').replace(/\bi\b/g,'I').replace(/\b[a-z]+\b/g,w=>PN.includes(w)?w[0].toUpperCase()+w.slice(1):w).replace(/([.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
r=r[0].toUpperCase()+r.slice(1);if(opt||type=='word'||type=='match'||r.split(' ').length<3||/^[\d\s+\-×÷=*\/^().%√,]+$/.test(r)||/[.?!:_)]$/.test(r))return r;
return r+(/^(what|why|how|when|where|who|whom|whose|which|is|are|do|does|did|can|could|will|would|should|has|have|was|were)\b/i.test(r)?'?':'.')}
function fixRaw(s,log){return s.raw.split('\n').map(l=>{if(!l.trim())return'';let m=l.match(NUM)||l.match(OPT),pre=m?m[0].trim()+' ':'',b=l.slice(m?m[0].length:0),r;
if(s.type=='match')r=l.split('|').map(x=>fmt(x,'match')).join(' | ');else r=pre+fmt(b,s.type,s.type=='mcq'&&!l.match(NUM)&&l.match(OPT));
if(r!==l.trim())log.push([l.trim(),r]);return r}).join('\n')}
const gap=(a,k)=>a.some((x,i)=>x.k.charCodeAt(0)-97!=i);
function check(p){const E=[],f=(l,m,i)=>E.push({l,m,i});
if(!p.cls)f('e','Class is missing.');if(!p.subject)f('e','Subject is missing.');if(!p.time)f('e','Time allowed is missing.');if(!p.exam)f('e','Examination is not selected.');if(!p.secs.length)f('e','The paper has no sections.');
p.secs.forEach((s,i)=>{const L='Section '+(i+1)+' ('+T[s.type]+')',qs=parse(s);if(!qs.length){f('e',L+' is empty.',i);return}
if(!(s.each>0))f('w',L+': marks per question are missing.',i);if(s.attempt>qs.length)f('e',L+': attempt '+s.attempt+' is more than the '+qs.length+' questions given.',i);
if(s.type=='passage'&&!s.pass.trim())f('e',L+': passage is empty.',i);
const ns=qs.map(q=>q.num).filter(x=>x!=null);if(ns.length){const sn={};ns.forEach(x=>{if(sn[x]==1)f('e','Warning: '+L+' has two questions numbered '+x+'.',i);sn[x]=(sn[x]||0)+1});
for(let k=1;k<=Math.max(...ns);k++)if(!sn[k])f('e','Warning: Question number '+k+' is missing in '+L+'. Please review your question sequence.',i);
if(ns.length<qs.length)f('w',L+': some questions have no number.',i);if(ns.some((x,j)=>j&&x<ns[j-1]))f('w',L+': question numbers are out of order.',i)}
qs.forEach((q,j)=>{const N=L+' Q'+(j+1);if(s.type!='match'&&!q.t.trim())f('e',N+' is empty.',i);else if(/[,\-:]$|\b(and|or|the|of|to)$/i.test(q.t.trim()))f('w',N+' looks incomplete.',i);
if(s.type=='mcq'){if(q.o.length<2)f('e',N+' has missing options (needs at least 2).',i);const ks=q.o.map(o=>o.k);if(new Set(ks).size<ks.length)f('e',N+' has duplicate option labels.',i);else if(gap(q.o))f('w',N+' option labels are not in sequence.',i)}
if(s.type=='match'&&(!q.t||!q.r))f('e',N+' is missing one side of the pair (use  left | right ).',i);
if(q.s.length){const ks=q.s.map(o=>o.k);if(new Set(ks).size<ks.length)f('e',N+' has duplicate sub-labels.',i);else if(gap(q.s))f('w',N+' sub-labels are missing or out of order.',i)}})});
if(p.declared&&+p.declared!==total(p))f('e','Declared total ('+p.declared+') does not match calculated total ('+total(p)+').');return E}
function sheet(p){const S=db.set;let h=`<div class="sh" style="font-size:${p.fs||S.font||12}pt"><div class="hd">${S.logo?`<img src="${S.logo}">`:''}<div><h1>${e(S.school)}</h1><div><b>${e(p.exam)} Examination ${e(p.session)}</b></div></div></div><table class="mt"><tr><td>Class: <b>${e(p.cls)}</b></td><td>Subject: <b>${e(p.subject)}</b></td><td>Time: <b>${e(p.time)}</b></td><td>Total Marks: <b>${total(p)}</b></td></tr><tr><td colspan="2">Name: ____________________</td><td>Roll No: ______</td><td>Date: ________</td></tr></table>`;
p.secs.forEach((s,i)=>{const qs=parse(s),n=qs.length,a=att(s);h+=`<section class="${s.rtl?'ur':''}" ${s.rtl?'dir="rtl"':''}><div class="sg"><b>Q.${i+1}&nbsp; ${e(s.instr)}</b>${a<n?` (Attempt any ${a} of ${n})`:''}<span>${a} × ${s.each} = ${a*s.each}</span></div>${s.type=='passage'&&s.pass?`<p class="ps">${e(s.pass)}</p>`:''}`;
if(s.type=='match')h+='<table class="mc">'+qs.map((q,j)=>`<tr><td>${j+1}. ${e(q.t)}</td><td>__________</td><td>${String.fromCharCode(65+j)}. ${e(q.r)}</td></tr>`).join('')+'</table>';
else qs.forEach((q,j)=>{let t=e(q.t);if(s.type=='fill')t=t.replace(/_{2,}|\.{4,}/g,'<u>&emsp;&emsp;&emsp;</u>');if(s.type=='tf')t+=' <i>(True / False)</i>';
h+=`<div class="q"><span>${j+1}.</span><div>${t}${q.o.length?`<div class="op ${s.horiz?'h':''}">`+q.o.map((o,x)=>`<span>(${String.fromCharCode(65+x)}) ${e(o.t)}</span>`).join('')+'</div>':''}${q.s.map((o,x)=>`<div class="sb">(${String.fromCharCode(97+x)}) ${e(o.t)}</div>`).join('')}</div></div>`});h+='</section>'});
return h+'<p style="text-align:center;margin-top:1em">— End of Paper —</p></div>'}
function R(){const a=$('#app');if(!me){a.innerHTML=`<div class="wrap" style="max-width:380px"><div class="card"><h2>🏫 ${e(db.set.school)}</h2><p class="sm">Exam Paper Generator — sign in</p><label>Username<input id="lu"></label><br><label>Password<input id="lp" type="password"></label><br><button class="pri" data-a="in">Sign in</button><hr><b>Teacher?</b><br><label>Your name<input id="tn"></label><br><button data-a="tin">Start as teacher</button><p class="sm">Administrator: sign in above (default admin / admin123 — change it in Settings after first login).</p></div></div>`;return}
a.innerHTML=`<div class="top"><b>🏫 ${e(db.set.school)}</b><span>${dip?'<button data-a="inst">Install app</button>':''}${e(me.name)} (${me.role})<button data-a="out">Logout</button></span></div><div class="wrap">${P?edH():dsH()}</div>`;if(P)refresh()}
function dsH(){const ad=me.role=='admin',L=ad?db.papers:db.papers.filter(p=>p.u==me.u);let h='';
if(ad)h+=`<div class="tabs">${['papers','teachers','settings','backup'].map(t=>`<button data-a="at" data-v="${t}" class="${ui.at==t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`;
if(!ad||ui.at=='papers')h+=`<div class="card"><div class="r"><h3 style="margin:0">${ad?'All papers':'My papers'}</h3><span class="sp"></span>${ad?'':'<button class="pri" data-a="new">+ New Paper</button>'}</div><div class="x"><table class="l"><tr><th>ID</th><th>Paper</th><th>Teacher</th><th>Status</th><th>Updated</th><th></th></tr>${L.map(p=>`<tr><td>${e(p.id||'Draft')}</td><td>${e(p.cls)} · ${e(p.subject)} · ${e(p.exam)}</td><td>${e(p.by)}</td><td><span class="b">${p.status}</span></td><td class="sm">${e(p.upd)}</td><td><button data-a="open" data-k="${p.k}">${['draft','revision'].includes(p.status)&&!ad?'Edit':'View'}</button> <button data-a="dup" data-k="${p.k}">Copy</button> <button data-a="shr" data-k="${p.k}">Share</button>${ad?` <button data-a="prn" data-k="${p.k}">Print</button>`:''}${['draft','revision'].includes(p.status)?` <button data-a="rm" data-k="${p.k}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class="sm">No papers yet.</td></tr>'}</table></div><div class="sm" style="margin-top:8px">Import a paper code received from a colleague or the admin:</div><textarea id="ipc" rows="2"></textarea><button data-a="ipp">Import paper</button></div>`;
if(ad&&ui.at=='teachers')h+=`<div class="card"><h3>Teachers</h3><div class="r"><label>Username<input id="nu"></label><label>Password<input id="np"></label><label>Full name<input id="nn"></label><label>Classes / subjects<input id="na" placeholder="Class 5, Class 6, English"></label><button class="pri" data-a="addu">Add</button></div><table class="l"><tr><th>User</th><th>Name</th><th>Assigned</th><th></th></tr>${db.users.map((u,i)=>`<tr><td>${e(u.u)}</td><td>${e(u.name)}</td><td>${e(u.as)}</td><td><button data-a="tg" data-i="${i}">${u.active?'Deactivate':'Activate'}</button> <button data-a="du" data-i="${i}">Delete</button></td></tr>`).join('')}</table></div>`;
if(ad&&ui.at=='settings'){const S=db.set;h+=`<div class="card"><h3>Header &amp; defaults</h3><div class="r"><label>School name<input data-set="school" value="${e(S.school)}"></label><label>Academic session<input data-set="session" value="${e(S.session)}"></label></div><div class="r"><label>Exam types (comma separated)<input data-set="exams" value="${e(S.exams.join(', '))}"></label><label>Default font size (pt)<input type="number" min="9" max="18" data-set="font" value="${S.font}"></label><label>Logo<input type="file" accept="image/*" id="lg"></label><label>Change my password<input type="password" data-pw="1" placeholder="new password"></label></div></div>`}
if(ad&&ui.at=='backup')h+=`<div class="card"><h3>Backup</h3><p class="sm">Copy this text and keep it safe.</p><textarea rows="6" readonly onclick="this.select()">${e(JSON.stringify(db))}</textarea><p class="sm">Restore: paste a backup here.</p><textarea id="imp" rows="4"></textarea><br><button data-a="imp">Import backup</button></div>`;return h}
function edH(){const lock=!['draft','revision'].includes(P.status),ad=me.role=='admin',as=(db.users.find(u=>u.u==P.u)||{as:''}).as.split(',').map(x=>x.trim()).filter(Boolean);
const f=(l,k,t='text',x='')=>`<label>${l}<input ${x} type="${t}" data-f="${k}" value="${e(P[k])}"></label>`;
return `<div class="bar"><button data-a="back">← Back</button><b>${e(P.id||'Draft')} · ${P.status}</b><span class="sp"></span>${lock?'':'<button data-a="fix">✨ Auto-correct</button><button data-a="undo">Undo</button><button data-a="ren">Renumber</button>'}<button data-a="share">📤 Share</button>${ad?'<button data-a="print">🖨 Print / PDF</button>':''}${lock?'':'<button class="pri" data-a="sub">Submit Paper</button>'}</div>
${ad&&P.status=='submitted'?`<div class="card"><b>Review</b><input id="an" placeholder="Note to teacher" style="width:100%;margin:6px 0"><button class="pri" data-a="ap">Approve</button> <button data-a="rv">Request revision</button> <button data-a="rj">Reject</button></div>`:''}
<div class="tabs m"><button data-a="tab" data-v="edit" class="${ui.tab=='edit'?'on':''}">Edit</button><button data-a="tab" data-v="pv" class="${ui.tab=='pv'?'on':''}">Preview</button></div>
<div class="g ${ui.tab}"><div id="ed">${P.note?`<div class="nt">Admin note: ${e(P.note)}</div>`:''}<fieldset ${lock?'disabled':''}><div class="card"><div class="r"><label>Examination<select data-f="exam">${db.set.exams.map(x=>`<option ${x==P.exam?'selected':''}>${e(x)}</option>`).join('')}</select></label>${f('Session','session')}</div><div class="r">${f('Class','cls','text','list="cl"')}${f('Subject','subject','text','list="sj"')}${f('Time allowed','time','text','placeholder="2 Hours"')}</div><div class="r">${f('Declared total (optional)','declared','number')}${f('Font size (pt)','fs','number','min="9" max="18"')}</div><datalist id="cl">${as.map(x=>`<option>${e(x)}`).join('')}</datalist><datalist id="sj">${as.map(x=>`<option>${e(x)}`).join('')}</datalist></div>
<div class="card"><div id="wn"></div><div id="tt" class="sm"></div></div>${P.secs.map(secH).join('')}<div class="r"><select id="nt">${Object.entries(T).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="pri" data-a="adds">+ Add section</button></div><div id="ch"></div></fieldset></div>
<div id="pv"><div class="sm">Live preview · <span id="pg"></span></div><div class="x" id="sheet" style="padding:6px 0"></div></div></div>`}
function secH(s,i){return `<div class="sc"><div class="r"><b>Q.${i+1}</b><select data-s="${i}" data-k="type">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${k==s.type?'selected':''}>${v}</option>`).join('')}</select><span class="sp"></span><button data-a="mp">∑ Symbols</button><button data-a="scan" data-i="${i}">📷 Scan</button><button data-a="up" data-i="${i}">↑</button><button data-a="dn" data-i="${i}">↓</button><button data-a="ds" data-i="${i}">✕</button></div>
<input style="width:100%" data-s="${i}" data-k="instr" value="${e(s.instr)}" placeholder="Instruction"><div class="r"><label>Marks each<input type="number" min="0" step="0.5" data-s="${i}" data-k="each" value="${s.each}"></label><label>Attempt any (0 = all)<input type="number" min="0" data-s="${i}" data-k="attempt" value="${s.attempt}"></label><label class="ck"><input type="checkbox" data-s="${i}" data-k="rtl" ${s.rtl?'checked':''}>Urdu / RTL</label>${s.type=='mcq'?`<label class="ck"><input type="checkbox" data-s="${i}" data-k="horiz" ${s.horiz?'checked':''}>Options in a row</label>`:''}</div>
${s.type=='passage'?`<textarea rows="4" data-s="${i}" data-k="pass" placeholder="Paste the passage here">${e(s.pass)}</textarea>`:''}<textarea rows="7" data-s="${i}" data-k="raw" ${s.rtl?'dir="rtl"':''} placeholder="${e(PH[s.type]||PH.x)}">${e(s.raw)}</textarea></div>`}
function refresh(){if(!P)return;const E=check(P);$('#wn').innerHTML=E.length?E.map(x=>`<div class="w ${x.l}">${x.l=='e'?'⛔':'⚠️'} ${e(x.m)}</div>`).join(''):'<div class="w ok">✔ No problems found.</div>';
$('#tt').innerHTML=P.secs.map((s,i)=>`Q.${i+1} ${T[s.type]}: ${att(s)}×${s.each}=${sm(s)}`).join(' · ')+` — <b>Total: ${total(P)} marks</b>`;
$('#sheet').innerHTML=`<div class="pap">${sheet(P)}</div>`;$('#pg').textContent='≈ '+Math.max(1,Math.ceil($('#sheet .sh').scrollHeight/1030))+' A4 page(s)';
const c=$('#ch');if(c)c.innerHTML=chg.length?`<div class="card"><b>Auto-corrections (${chg.length})</b> <span class="sm">— press Undo to revert all</span>${chg.slice(0,40).map(x=>`<div class="sm">${e(x[0])} → <b>${e(x[1])}</b></div>`).join('')}</div>`:'';
if(['draft','revision'].includes(P.status)){clearTimeout(tm);tm=setTimeout(()=>{P.upd=now();save()},300)}}
function pr(p){if(me.role!='admin')return;$('#print').innerHTML=`<div class="pap">${sheet(p)}</div>`;try{window.print()}catch(x){toast('Printing is blocked here — open the page in a full browser tab.')}}
function ptxt(p){const S=db.set;let t=S.school+'\n'+p.exam+' Examination '+p.session+'\nClass: '+p.cls+' | Subject: '+p.subject+' | Time: '+p.time+' | Total Marks: '+total(p)+'\n';
p.secs.forEach((s,i)=>{const qs=parse(s),a=att(s);t+='\nQ.'+(i+1)+' '+s.instr+' ('+a+' × '+s.each+' = '+a*s.each+')\n';if(s.type=='passage'&&s.pass)t+=s.pass+'\n';
qs.forEach((q,j)=>{t+=(j+1)+'. '+(s.type=='match'?q.t+'  —  '+String.fromCharCode(65+j)+'. '+q.r:q.t)+'\n';q.o.forEach((o,x)=>t+='   ('+String.fromCharCode(65+x)+') '+o.t+'\n');q.s.forEach((o,x)=>t+='   ('+String.fromCharCode(97+x)+') '+o.t+'\n')})});return t}
function shareP(p){const t=ptxt(p),el=$('#shr');el.innerHTML=`<div class="card"><b>Share paper</b><a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">WhatsApp</a>${navigator.share?'<button id="ns">Other apps…</button>':''}<button id="cp">Copy text</button><button id="cc">Copy paper code (for admin to import)</button><button id="cx">Close</button></div>`;el.classList.add('on');
$('#cx').onclick=()=>el.classList.remove('on');$('#cc').onclick=async()=>{try{await navigator.clipboard.writeText('HMSPAPER:'+btoa(unescape(encodeURIComponent(JSON.stringify(p)))));toast('Code copied - send it by WhatsApp')}catch(x){toast('Copy not available')}};$('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(t);toast('Copied — paste it anywhere')}catch(x){toast('Copy not available')}};const n=$('#ns');if(n)n.onclick=()=>navigator.share({title:p.subject,text:t}).catch(()=>{})}
let dip=null,lastEl=null;
addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();dip=ev;if(me&&!P)R()});
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.tagName=='TEXTAREA'||(t.tagName=='INPUT'&&t.dataset.k))lastEl=t});
const MP={Basic:'+ − × ÷ ± ∓ = ≠ ≈ ≡ < > ≤ ≥ ≪ ≫ % ‰ ° ′ ″ ∞ ∝ · ( ) [ ] { } | ‖ ₨ ₹ $ £ €',Powers:'² ³ ⁴ ⁵ ⁶ ⁷ ⁸ ⁹ ⁰ ⁿ ⁺ ⁻ ₀ ₁ ₂ ₃ ₄ ₅ ₆ ₇ ₈ ₉ ₙ √ ∛ ∜ ½ ⅓ ⅔ ¼ ¾ ⅕ ⅖ ⅗ ⅘ ⅙ ⅚ ⅛ ⅜ ⅝ ⅞ ⁄',Algebra:'∈ ∉ ∋ ⊂ ⊃ ⊆ ⊇ ∪ ∩ ∅ ∖ ℕ ℤ ℚ ℝ ℂ ∀ ∃ ∄ ∴ ∵ ∧ ∨ ¬ ⇒ ⇔ → ← ↔ ∣ ≤ ≥',Geometry:'∠ ∡ ∟ ⊥ ∥ △ □ ▱ ○ ◇ ≅ ∼ ⌒ ⊙ ⌀ ° ′ ″ π ↗ ⟶',Greek:'α β γ δ ε ζ η θ ι κ λ μ ν ξ ο π ρ σ τ υ φ χ ψ ω Γ Δ Θ Λ Ξ Π Σ Φ Ψ Ω',Calculus:'∑ ∏ ∫ ∬ ∮ ∂ ∇ ∆ ⌊ ⌋ ⌈ ⌉ ⟨ ⟩ ∘ ⊕ ⊗ ℓ ℏ lim d/dx sin cos tan log ln',Templates:'x² + y² = r² | √( ) | a/b | (a + b)² = a² + 2ab + b² | x = (−b ± √(b² − 4ac)) / 2a | ∠ABC = 90° | △ABC ≅ △PQR | ∑ᵢ₌₁ⁿ | lim x→∞ | log₁₀ x'};
function mpR(){const w=$('#mpw');w.className=ui.mp?'on':'';if(!ui.mp){w.innerHTML='';return}const c=ui.mc||'Basic';w.innerHTML=`<div class="x" style="white-space:nowrap">${Object.keys(MP).map(k=>`<button data-a="mpt" data-v="${k}" class="${k==c?'on':''}">${k}</button>`).join(' ')} <button data-a="mp">✕ Close</button></div><div class="sy">${MP[c].split(c=='Templates'?' | ':' ').map(x=>`<button data-a="mpi">${e(x)}</button>`).join('')}</div>`}
function ins(t){const el=lastEl;if(!el||!document.contains(el))return toast('Tap inside a question box first, then choose a symbol');const a=el.selectionStart,b=el.selectionEnd;el.setRangeText(t,a,b,'end');el.focus();el.dispatchEvent(new Event('input',{bubbles:true}))}
document.addEventListener('mousedown',ev=>{if(ev.target.closest('#mpw'))ev.preventDefault()});
const lt=()=>window.Tesseract?Promise.resolve():new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)});
async function ocr(i,f){const s=P.secs[i];try{toast('Loading scanner… (needs internet the first time only)');await lt();const r=await Tesseract.recognize(f,s.rtl?'urd+eng':'eng',{logger:m=>{if(m.status=='recognizing text')toast('Reading… '+Math.round(m.progress*100)+'%')}});const t=r.data.text.split('\n').map(x=>x.trim()).filter(Boolean).join('\n');if(!t)return toast('No text found — try a clearer, straight photo');if(s.type=='passage'&&!s.pass)s.pass=t;else s.raw+=(s.raw?'\n':'')+t;R();toast('Scanned text added — review it, then tap Auto-correct')}catch(x){toast('Scanner could not load. Connect to the internet once and try again.')}}
document.addEventListener('change',ev=>{if(ev.target.id=='sf'&&ev.target.files[0]&&P)ocr(ui.si,ev.target.files[0])});
const byK=k=>db.papers.find(p=>p.k==k);
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;if(d.pw){me.p=t.value;save();return}if(d.set){const v=t.value;db.set[d.set]=d.set=='exams'?v.split(',').map(x=>x.trim()).filter(Boolean):d.set=='font'?+v:v;save();return}
if(!P)return;const v=t.type=='checkbox'?+t.checked:t.value;
if(d.k!==undefined){const s=P.secs[+d.s];if(d.k=='type'){if(!s.instr||s.instr==INS[s.type])s.instr=INS[v];s.type=v;s.each=v=='mcq'?1:s.each;R();return}s[d.k]=['each','attempt'].includes(d.k)?+v:v}else if(d.f)P[d.f]=['fs','declared'].includes(d.f)&&v!==''?+v:v;else return;refresh()});
document.addEventListener('change',ev=>{if(ev.target.id=='lg'){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{db.set.logo=r.result;save();toast('Logo saved')};r.readAsDataURL(f)}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset,i=+d.i;
if(a=='in'){const u=db.users.find(x=>x.u==$('#lu').value.trim()&&x.p==$('#lp').value);if(!u||!u.active)return toast('Wrong username/password or inactive account');me=u}
else if(a=='inst'){if(dip){dip.prompt();dip=null}}else if(a=='mp'){ui.mp=!ui.mp;mpR();return}else if(a=='scan'){ui.si=i;$('#sf').value='';$('#sf').click();return}else if(a=='mpt'){ui.mc=d.v;mpR();return}else if(a=='mpi'){ins(b.textContent);return}else if(a=='tin'){const n=$('#tn').value.trim();if(!n)return toast('Enter your name');const u=n.toLowerCase().replace(/\s+/g,'_');let x=db.users.find(y=>y.u==u);if(x&&x.role=='admin')return toast('Please use the admin sign-in');if(!x){x={u,p:'',name:n,role:'teacher',active:1,as:''};db.users.push(x)}if(!x.active)return toast('Account inactive');me=x}
else if(a=='out'){me=null;P=null}else if(a=='at')ui.at=d.v;else if(a=='tab')ui.tab=d.v;
else if(a=='new'){P={k:Date.now()+'',u:me.u,by:me.name,exam:db.set.exams[0]||'',session:db.set.session,cls:'',subject:'',time:'',declared:'',fs:db.set.font,status:'draft',secs:[sec('mcq')],at:'',id:'',note:'',upd:now()};db.papers.push(P);undo=null;chg=[];ui.tab='edit'}
else if(a=='open'){P=byK(d.k);undo=null;chg=[]}else if(a=='back'){P=null;save()}
else if(a=='dup'){const o=byK(d.k),c=JSON.parse(JSON.stringify(o));Object.assign(c,{k:Date.now()+'',u:me.u,by:me.name,status:'draft',id:'',at:'',note:'',upd:now()});db.papers.push(c);save();toast('Copied as a new draft')}
else if(a=='prn'||a=='print'){if(me.role!='admin')return toast('Printing is for the administrator only');return pr(a=='prn'?byK(d.k):P)}else if(a=='shr'||a=='share'){shareP(a=='shr'?byK(d.k):P);return}
else if(a=='rm'){db.papers=db.papers.filter(p=>p.k!=d.k);save()}
else if(a=='adds'){P.secs.push(sec($('#nt').value))}else if(a=='ds'){P.secs.splice(i,1)}
else if(a=='up'&&i>0){[P.secs[i-1],P.secs[i]]=[P.secs[i],P.secs[i-1]]}else if(a=='dn'&&i<P.secs.length-1){[P.secs[i+1],P.secs[i]]=[P.secs[i],P.secs[i+1]]}
else if(a=='fix'){undo=P.secs.map(s=>[s.raw,s.pass]);chg=[];P.secs.forEach(s=>{s.raw=fixRaw(s,chg);if(s.pass)s.pass=s.pass.split('\n').map(x=>fmt(x,'p',1)).join('\n')});toast(chg.length?chg.length+' line(s) corrected — review below or Undo':'Nothing to correct')}
else if(a=='undo'){if(undo){P.secs.forEach((s,j)=>{if(undo[j]){s.raw=undo[j][0];s.pass=undo[j][1]}});undo=null;chg=[];toast('Corrections undone')}}
else if(a=='ren'){P.secs.forEach(s=>{if(s.type!='match')s.raw=s.raw.split('\n').map(l=>l.replace(NUM,'')).join('\n')});toast('Manual numbers removed — questions are now numbered automatically')}
else if(a=='sub'){const E=check(P).filter(x=>x.l=='e');if(E.length){toast(E.length+' error(s) must be fixed before submitting');$('#wn').scrollIntoView();return}
db.n++;Object.assign(P,{status:'submitted',id:'HMS-'+new Date().getFullYear()+'-'+String(db.n).padStart(4,'0')+'-'+me.u.slice(0,3).toUpperCase(),at:now(),upd:now(),note:''});toast('Submitted as '+P.id)}
else if(['ap','rv','rj'].includes(a)){P.status={ap:'approved',rv:'revision',rj:'rejected'}[a];P.note=$('#an').value;P.upd=now();P=null}
else if(a=='addu'){const u=$('#nu').value.trim();if(!u||!$('#np').value||db.users.some(x=>x.u==u))return toast('Enter a unique username and a password');db.users.push({u,p:$('#np').value,name:$('#nn').value||u,role:'teacher',active:1,as:$('#na').value})}
else if(a=='tg'){if(db.users[i]!=me)db.users[i].active=+!db.users[i].active}else if(a=='du'){if(db.users[i]!=me)db.users.splice(i,1)}
else if(a=='ipp'){try{const c=$('#ipc').value.trim().replace(/^HMSPAPER:/,''),x=JSON.parse(decodeURIComponent(escape(atob(c))));if(!x.k||!x.secs)throw 0;const j=db.papers.findIndex(p=>p.k==x.k);if(j>=0)db.papers[j]=x;else db.papers.push(x);toast('Paper imported')}catch(x){return toast('Invalid paper code')}}
else if(a=='imp'){try{const x=JSON.parse($('#imp').value);if(!x.users||!x.papers||!x.set)throw 0;db=x;me=db.users.find(u=>u.u==me.u)||null;P=null;toast('Backup restored')}catch(x){return toast('Invalid backup text')}}
save();R()});
$('#app').addEventListener('keydown',ev=>{if(ev.key=='Enter'&&!me)document.querySelector('[data-a=in]').click()});R();if('serviceWorker' in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
